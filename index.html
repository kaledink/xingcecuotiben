<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="行测错题本：导入卷子和答案 PDF 自动拆题，一题一页计时做题，画板演算，错题本、笔记、知识点统计与导出。数据只保存在你自己的设备上。">
<meta name="theme-color" content="#30509b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="错题本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>行测错题本</title>
<style>
/* Layout: answer-sheet paper ground, white question sheets, ink-blue pen accent; red/green reserved for 对/错 */
:root{
  --paper:#eef0ec; --card:#ffffff; --sunk:#f6f7f4; --ink:#1b2326; --ink2:#566265; --ink3:#8a9497; --line:#dce1dc;
  --accent:#30509b; --accent-soft:#e3e9f6; --on-accent:#ffffff;
  --good:#1f8456; --good-soft:#dcf0e5; --bad:#c43d2b; --bad-soft:#f8e1dc; --mark:#b97c0a; --mark-soft:#f6ebd2;
  --shadow:0 1px 2px rgba(20,30,35,.06),0 4px 14px rgba(20,30,35,.05);
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121618; --card:#1b2124; --sunk:#171c1e; --ink:#e5ebe8; --ink2:#a2adab; --ink3:#727d7c; --line:#2b3437;
  --accent:#93acf5; --accent-soft:#25304a; --on-accent:#0f1626;
  --good:#52c08b; --good-soft:#163527; --bad:#f07a63; --bad-soft:#3e1f1a; --mark:#e3b24c; --mark-soft:#3a2f17;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121618; --card:#1b2124; --sunk:#171c1e; --ink:#e5ebe8; --ink2:#a2adab; --ink3:#727d7c; --line:#2b3437;
  --accent:#93acf5; --accent-soft:#25304a; --on-accent:#0f1626;
  --good:#52c08b; --good-soft:#163527; --bad:#f07a63; --bad-soft:#3e1f1a; --mark:#e3b24c; --mark-soft:#3a2f17;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
/* ---------- shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:22px;border:2px solid var(--accent);border-radius:3px;position:relative}
.brand i::after{content:"";position:absolute;left:3px;right:3px;top:5px;height:3px;background:var(--accent);box-shadow:0 6px 0 var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
.tab{border:0;background:none;padding:6px 12px;border-radius:999px;color:var(--ink2);white-space:nowrap}
.tab[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.store-chip{font-size:12px;color:var(--ink3);white-space:nowrap}
@media (max-width:640px){.tabs{order:3;flex-basis:100%}.topbar-in{gap:6px 12px}.brand{flex:1}}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
.section-title{font-size:13px;letter-spacing:.08em;color:var(--ink3);margin:28px 0 10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.mark{background:var(--mark-soft);color:var(--mark);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
input[type=text],input[type=number],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:100;font-size:14px;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:40px 16px;color:var(--ink2)}
.bar-bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-bottom .in{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ---------- library ---------- */
.papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.paper{display:flex;flex-direction:column;gap:10px}
.paper h3{font-family:var(--f-display);font-size:17px;line-height:1.4}
.import-card{border:1.5px dashed var(--ink3);background:transparent;box-shadow:none;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:150px;text-align:left}
.kpi{display:flex;gap:28px;flex-wrap:wrap}
.kpi div b{display:block;font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1.2}
.kpi div span{font-size:12px;color:var(--ink3)}
/* ---------- import ---------- */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.drop{display:flex;flex-direction:column;gap:8px}
.drop input[type=file]{font-size:13px;max-width:100%}
.review{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.review{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 96px);overflow:auto}
@media (max-width:860px){.side{position:static;max-height:none}}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.pages{display:flex;flex-direction:column;gap:14px}
.pg{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:crosshair}
.pg canvas{display:block;width:100%;height:auto}
.pg .band{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(120,130,140,.18) 0 6px,transparent 6px 12px);pointer-events:none}
.mk{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--c);pointer-events:none}
.mk b{position:absolute;left:0;top:-1px;transform:translateY(-100%);background:var(--c);color:#fff;font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px 4px 4px 0;pointer-events:auto;cursor:pointer;white-space:nowrap;font-family:var(--f-body)}
.mk.q{--c:#30509b} .mk.mat{--c:#b06a00} .mk.cut{--c:#7a7f86}
.mk b:hover::after{content:" ×"}
.pg .pno{position:absolute;right:6px;top:4px;font-size:11px;color:#777;background:rgba(255,255,255,.8);padding:0 4px;border-radius:3px}
.warn{background:var(--mark-soft);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px}
.modrow{display:grid;grid-template-columns:minmax(0,1fr) 70px 30px;gap:6px;align-items:center}
.modrow input,.modrow select{min-height:32px;padding:4px 8px;font-size:13px;width:100%}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
/* ---------- practice ---------- */
.prac{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.prac-top{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.prac-top .title{flex:1;min-width:0;text-align:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{border:0;background:transparent;width:40px;height:40px;border-radius:8px;display:inline-grid;place-items:center;color:var(--ink2)}
.ico:hover{background:var(--sunk)}
.ico[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ico.marked{color:var(--mark)}
.ico svg{width:22px;height:22px}
.timer{font-family:var(--f-num);font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:4px;min-width:76px}
.prac-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.prac-body.has-mat{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){.prac-body.has-mat{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}}
.matpane{overflow:auto;border-right:1px solid var(--line);background:var(--sunk);padding:14px}
@media (max-width:900px){.matpane{border-right:0;border-bottom:1px solid var(--line);max-height:38vh}}
.matpane .lbl{font-size:12px;color:var(--ink3);margin-bottom:6px;display:flex;justify-content:space-between}
.qpane{overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.qsheet{max-width:860px;margin:0 auto;padding:16px;position:relative}
.qimg{display:block;width:100%;height:auto;background:#fff;border-radius:6px;border:1px solid var(--line)}
.matpane .qimg{border-radius:4px}
.qmeta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.opts{display:flex;gap:14px;margin:18px 0 8px;flex-wrap:wrap}
.opt{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:20px;font-weight:600;color:var(--ink2)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.scratch{height:55vh}
.ink{position:absolute;left:0;top:0;pointer-events:none;z-index:5}
.ink.on{pointer-events:auto;touch-action:none;cursor:crosshair}
.inkbar{position:absolute;right:16px;top:12px;z-index:8;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
.inkbar .ico{width:36px;height:36px}
.prac-foot{display:flex;justify-content:space-between;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,20,.4);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.grid-q{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px;margin:8px 0 16px}
.qdot{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-family:var(--f-num);font-size:14px;position:relative;color:var(--ink2)}
.qdot.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qdot.good{background:var(--good);border-color:var(--good);color:#fff}
.qdot.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.qdot.unk{background:var(--sunk);color:var(--ink3)}
.qdot.cur{box-shadow:0 0 0 3px var(--ink)}
.qdot.flag::after{content:"";position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:var(--mark);border:2px solid var(--card)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* ---------- report ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:600px){.hero{grid-template-columns:minmax(0,1fr)}}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring>div{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--f-num);font-size:34px;line-height:1}
.ring span{font-size:12px;color:var(--ink3)}
.mods{display:flex;flex-direction:column}
.mod{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mod:first-child{border-top:0}
.mod .nm{font-weight:600;font-size:14px}
.mod .nm small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.meter{display:flex;align-items:center;gap:8px;font-size:13px}
.meter .track{flex:1;height:10px;background:var(--sunk);border-radius:99px;position:relative;overflow:hidden}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--c,var(--accent))}
.meter .track .sug{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.meter .track{overflow:visible}
.meter .track .fill{border-radius:99px}
.meter .v{min-width:58px;line-height:1.3;text-align:right;font-family:var(--f-num);font-size:13px}
.mod-head{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) minmax(0,1fr);gap:16px;font-size:12px;color:var(--ink3)}
@media (max-width:600px){.mod,.mod-head{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mod .nm{grid-column:1/-1}.mod-head span:first-child{display:none}}
/* ---------- review ---------- */
.rv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.rv{grid-template-columns:minmax(0,1fr)}}
.ana{white-space:pre-wrap;user-select:text;-webkit-user-select:text;line-height:1.8;font-size:15px;max-height:60vh;overflow:auto;padding-right:4px}
.ansline{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin:12px 0}
.ansline b{font-family:var(--f-num);font-size:18px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag button{border:0;background:transparent;color:inherit;padding:0 6px;font-size:14px}
details summary{cursor:pointer;color:var(--ink2);font-size:13px}
/* ---------- book ---------- */
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp-h{display:flex;align-items:center;gap:10px;padding:14px 4px}
.grp-h .nm{font-weight:600;flex:1}
.caret{border:0;background:var(--accent);color:var(--on-accent);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;transition:transform .15s}
.caret[aria-expanded="false"]{transform:rotate(-90deg)}
.qrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px 10px 36px;border-top:1px dashed var(--line);font-size:14px}
.qrow .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.qrow .txt:hover{color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{color:var(--ink3);font-weight:500}
.tblwrap{overflow-x:auto}
.kpname{width:10em;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpd>summary{list-style:none;cursor:pointer;padding:5px 0}
.kpd>summary::-webkit-details-marker{display:none}
.kpd>summary .kpname::before{content:"▸ ";color:var(--ink3)}
.kpd[open]>summary .kpname::before{content:"▾ "}
.kpkids{padding-left:16px;border-left:1px solid var(--line);margin-left:6px}
.kpleaf{padding:5px 0}
.kpleaf .kpname{padding-left:1em}
.kptree{max-height:52vh;overflow:auto;margin-top:10px;border-top:1px solid var(--line)}
.kpn{display:flex;align-items:center;gap:6px;padding:3px 0}
.kpn button.add{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:14px;text-align:left}
.kpn button.add.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kpn .tw{border:0;background:none;width:24px;color:var(--ink3);font-size:12px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 18px;border-radius:999px;color:var(--ink2)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.hist{display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;align-items:center;gap:14px}
.hmain{flex:1;min-width:0;border:0;background:none;text-align:left;display:flex;flex-direction:column;gap:6px;padding:0}
.hmain b{font-size:16px;font-weight:600;line-height:1.4}
.hmain:hover b{color:var(--accent)}
.hscore{font-family:var(--f-num);font-size:22px;font-weight:600;color:var(--mark);white-space:nowrap}
.hscore small{font-size:13px;color:var(--ink3);font-weight:500}
.tabbadge:not(:empty){display:inline-block;margin-left:4px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}
.memo{position:fixed;right:0;top:0;bottom:0;width:min(340px,100%);z-index:50;background:var(--card);border-left:1px solid var(--line);box-shadow:-6px 0 20px rgba(0,0,0,.08);padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;overflow:auto}
.memo-h{display:flex;align-items:center;gap:8px}
.memo-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.memo-sub{font-size:12px;color:var(--ink3);margin-top:6px;letter-spacing:.06em}
.memo-e{background:var(--sunk);border-radius:8px;padding:8px 10px}
.memo-t,.memo-line span{white-space:pre-wrap;font-size:14px}
.memo-del{border:0;background:none;color:var(--ink3);font-size:12px;padding:2px 4px}
.memo-del:hover{color:var(--bad)}

function setupInk() {

const KPUI = { qid: null, all: false, q: "", open: new Set() };
function kpOpen(qid) { KPUI.qid = qid; KPUI.q = ""; KPUI.all = false; KPUI.open = new Set(); showSheet(`<div id="kpSheet"></div>`); drawKp(); }
function drawKp() {

async function kpToggle(path) { const cur = qs(KPUI.qid).kp || []; const kp = cur.includes(path) ? cur.filter(x => x !== path) : [...cur, path]; await setQS(KPUI.qid, { kp }); drawKp(); }
async function aiTag(qid) {
  if (!S.sample) throw { code: "unavailable" };
  const q = D.questions.get(qid); const cands = kpUnder(rootsFor(q.module));
  const prompt = `你在帮一名备考公务员行测的考生给错题归类知识点。
从下面的“候选知识点”中，为这道题选出 1 到 2 个最具体、最贴切的知识点。必须原样复制候选列表里的完整路径（用 / 分隔），不要自己编。
只输出 JSON，格式：{"kp": ["完整路径"]}

模块：${q.module || "未知"}
题目（OCR 识别文字，可能有错字）：
${(q.text || "").slice(0, 1500)}

参考答案：${q.answer || "未知"}
解析：
${(q.analysis || "无").slice(0, 1800)}

候选知识点：
${cands.join("\n")}`;
  const res = await S.sample.json(prompt, { modelTier: "quick" });
  const picked = (res && Array.isArray(res.kp) ? res.kp : []).map(x => String(x).trim()).filter(x => KP.all.has(x)).slice(0, 2);
  if (!picked.length) return [];
  const kp = [...new Set([...(qs(qid).kp || []), ...picked])]; await setQS(qid, { kp }); return picked;
}
const aiErr = e => ({ not_granted: "没有获得使用 AI 的许可", rate_limited: "请求太频繁，稍后再试", cancelled: "已取消" }[e?.code] || "AI 归类失败：" + (e?.message || e?.code || "未知错误"));
async function aiBatch(items) {

  if (!todo.length) return toast("选中的题都已经有知识点了");
  let done = 0;
  for (const x of todo) {
    toast(`AI 归类中 ${done + 1}/${todo.length}…`, 60000);

  toast(`已为 ${done} 道题标好知识点${items.length > todo.length ? "（每次最多 20 道，已有知识点的会跳过）" : ""}`, 4000); render();
}

    const byQ = new Map(); entries.forEach(e => { if (!byQ.has(e.qid)) byQ.set(e.qid, []); byQ.get(e.qid).push(e); });
    const todos = D.todos.filter(t => t.pid === pid).sort((x, y) => (x.done - y.done) || (({ 高: 0, 中: 1, 低: 2 })[x.pri] ?? 1) - (({ 高: 0, 中: 1, 低: 2 })[y.pri] ?? 1));

function paperFacts(pid, aid) {
  const a = D.attempts.find(x => x.id === aid && x.finishedAt) || D.attempts.find(x => x.pid === pid && x.finishedAt);
  const qids = paperQids(pid);
  const wrong = qids.filter(id => { const r = a?.answers?.[id]; return r && (r.res === "no" || r.res === "blank"); });
  const mods = a ? Object.entries(a.summary.byMod).filter(([m]) => !a.pid || true) : [];
  return { a, wrong, mods };
}
function addTodos(list) {
  let added = 0;
  for (const t of list) {
    if (!t.text || D.todos.some(x => !x.done && x.pid === t.pid && x.text === t.text)) continue;
    const doc = { id: uid("t"), createdAt: Date.now(), done: false, ...t }; D.todos.unshift(doc); queueWrite("todos", doc.id, doc); added++;
  }

}
function ruleTodos(pid, aid) {
  const { a, wrong, mods } = paperFacts(pid, aid); const out = [];
  if (!a) return out;
  const scope = a.pid ? mods : mods.filter(([m]) => wrong.some(id => (D.questions.get(id)?.module || "未分类") === m));
  const rows = scope.map(([m, x]) => ({ m, acc: pct(x.ok, x.n), x })).sort((p, q) => p.acc - q.acc);
  for (const r of rows) {
    const nWrong = wrong.filter(id => (D.questions.get(id)?.module || "未分类") === r.m).length;
    if (nWrong && r.acc < 70) out.push({ pid, mod: r.m, pri: r.acc < 50 ? "高" : "中", src: "rule", text: `重做本卷「${r.m}」的 ${nWrong} 道错题，对照解析写清错因（本卷正确率 ${r.acc}%）` });
    if (r.x.sug && r.x.t > r.x.sug * 1.1) out.push({ pid, mod: r.m, pri: "中", src: "rule", text: `「${r.m}」限时训练：本卷用了 ${fmtT(r.x.t)}，建议 ${fmtT(r.x.sug)}，下次按建议时间做一组` });
  }
  const kpCount = new Map(); let untagged = 0;
  for (const id of wrong) { const k = (qs(id).kp || []).filter(x => KP.all.has(x)); if (!k.length) untagged++; k.forEach(x => kpCount.set(x, (kpCount.get(x) || 0) + 1)); }
  [...kpCount.entries()].sort((x, y) => y[1] - x[1]).slice(0, 4).forEach(([k, n]) => out.push({ pid, mod: k.split("/")[0], pri: n >= 2 ? "高" : "中", src: "rule", text: `复习知识点「${kpShort(k)}」（本卷错 ${n} 题），对照思维导图过一遍` }));

${wrongLines || "（无）"}

${memoLines}

function vStats() {

  if (!done.length) return `<div class="card empty">做完第一套题后，这里会显示每套题各模块的用时和正确率，以及各知识点的正确率。</div>`;

    const r = a.answers[qid]; const q = D.questions.get(qid); if (!q || !r || r.res === "unk") continue;
    const m = mod[q.module || "未分类"] ||= { n: 0, ok: 0, t: 0 }; m.n++; m.t += r.t || 0; if (r.res === "ok") m.ok++;
    const paths = new Set(); for (const k of (qs(qid).kp || [])) { const segs = (KP.all.has(k) ? k : "自定义标签/" + k).split("/"); for (let i = 1; i <= segs.length; i++) paths.add(segs.slice(0, i).join("/")); }

    ${done.map(a => `<tr><td class="num">${fmtDate(a.finishedAt)}</td><td>${esc(a.title)}${a.mode === "redo" ? ' <span class="chip">重做</span>' : ""}</td><td class="num">${a.summary.acc}%</td><td class="num">${fmtT(a.summary.time)}</td>${MODULES.filter(m => done.some(x => x.summary.byMod[m])).map(m => { const b = a.summary.byMod[m]; return `<td class="num">${b ? `${pct(b.ok, b.n)}% · ${fmtT(b.t)}` : "—"}</td>`; }).join("")}<td><button class="btn sm" data-act="report" data-id="${a.id}">报告</button></td></tr>`).join("")}
  </tbody></table></section>

  <section class="card pad">${kpRows.length ? kidsOf("").map(x => kpNode(x, 0)).join("") : `<p class="small muted">还没有给题目标知识点。在解析页点“选择知识点”（或“AI 推荐”），这里会按 模块 › 专题 › 知识点 汇总正确率，括号里是做过的题数。</p>`}</section>`;

/* =====================================================================
   PDF export (pages drawn on canvas, then packed with jsPDF)
   ===================================================================== */
const PW = 1240, PH = 1754, M = 90, CW = PW - 2 * M;
const PFONT = '"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif';
class PdfBuilder {
  constructor(title) { this.pages = []; this.title = title; this.newPage(); }
  newPage() { const c = document.createElement("canvas"); c.width = PW; c.height = PH; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, PW, PH); x.textBaseline = "top"; this.c = c; this.x = x; this.y = M; this.pages.push(c);
    x.fillStyle = "#888"; x.font = `20px ${PFONT}`; x.fillText(this.title, M, 40); x.fillText(`第 ${this.pages.length} 页`, PW - M - 80, PH - 60); }
  space(h) { if (this.y + h > PH - M) this.newPage(); }
  text(str, { size = 26, color = "#1b2326", bold = false, gap = 10, lh = 1.6, indent = 0 } = {}) {
    const x = this.x; x.font = `${bold ? "600 " : ""}${size}px ${PFONT}`; x.fillStyle = color;
    for (const para of String(str).split("\n")) {
      let line = ""; const lines = [];
      for (const ch of para) { if (x.measureText(line + ch).width > CW - indent) { lines.push(line); line = ch; } else line += ch; }
      lines.push(line);
      for (const l of lines) { this.space(size * lh); x.font = `${bold ? "600 " : ""}${size}px ${PFONT}`; x.fillStyle = color; x.fillText(l, M + indent, this.y); this.y += size * lh; }
    }
    this.y += gap;
  }
  async image(ref) {
    const b = await loadBlob(ref); if (!b) { this.text("（图片缺失）", { color: "#999" }); return; }
    const im = await createImageBitmap(b); const s = Math.min(1, CW / im.width); const w = im.width * s; let h = im.height * s, sy = 0;
    if (this.y + Math.min(h, 300) > PH - M) this.newPage();
    while (h > 0) { const room = PH - M - this.y; const take = Math.min(h, room); this.x.drawImage(im, 0, sy / s, im.width, take / s, M, this.y, w, take); this.y += take; h -= take; sy += take; if (h > 0) this.newPage(); }
    this.y += 16;
  }
  rule() { this.space(20); this.x.fillStyle = "#e2e5e2"; this.x.fillRect(M, this.y + 8, CW, 2); this.y += 24; }
  async blob() {
    const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: "px", format: [PW, PH], hotfixes: ["px_scaling"], compress: true });
    this.pages.forEach((c, i) => { if (i) doc.addPage([PW, PH]); doc.addImage(c.toDataURL("image/jpeg", 0.86), "JPEG", 0, 0, PW, PH); });
    return doc.output("blob");
  }
}

async function backup() {
  toast("正在打包备份…", 30000);
  const out = { v: 1, papers: D.papers, questions: [...D.questions.values()], attempts: D.attempts, qstate: [...D.qstate.values()], images: {} };
  for (const q of out.questions) for (const ref of [q.img, q.mat]) if (ref && !out.images[ref]) { const b = await loadBlob(ref); if (b) out.images[ref] = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }
  await saveFile(`错题本备份-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(out));
}
async function restoreBackup(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text()); const map = {};
    toast("正在恢复…", 60000);
    for (const [ref, du] of Object.entries(data.images || {})) { const b = await (await fetch(du)).blob(); map[ref] = await putImage(b); }
    for (const q of data.questions) { q.img = map[q.img] || q.img; q.mat = map[q.mat] || q.mat; }
    for (const [col, list] of [["papers", data.papers], ["questions", data.questions], ["attempts", data.attempts], ["qstate", data.qstate]]) for (const x of list || []) await dbPut(col, x.id, x);
    await loadData(); toast("备份已恢复"); render();
  } catch (e) { toast("恢复失败：" + e.message); }
}

  const k = e.key.toUpperCase();
  if ("ABCD".includes(k) && k.length === 1) $(`.opt[data-l="${k}"]`)?.click();
  else if ("1234".includes(k) && k.length === 1) $(`.opt[data-l="${"ABCD"[+k - 1]}"]`)?.click();
  else if (e.key === "ArrowRight") practiceGo(P.a.cur + 1);
  else if (e.key === "ArrowLeft") practiceGo(P.a.cur - 1);
});
// tooltips for meters
document.addEventListener("pointerover", e => { const el = e.target.closest("[data-tip]"); let t = $("#tipEl"); if (!el) { if (t) t.hidden = true; return; } if (!t) { t = document.createElement("div"); t.id = "tipEl"; t.className = "tip"; document.body.appendChild(t); } t.textContent = el.dataset.tip; t.hidden = false; const r = el.getBoundingClientRect(); t.style.left = Math.min(window.innerWidth - 250, r.left) + "px"; t.style.top = (r.top - 34) + "px"; });
window.addEventListener("resize", () => { if (P && P.ink) setupInk(); });
document.addEventListener("scroll", () => { const t = $("#tipEl"); if (t) t.hidden = true; }, true);

/* =====================================================================
   Boot
   ===================================================================== */
(async function boot() {
  await initStorage();
  try { await loadData(); const m = await dbAll("meta"); D.meta = Object.fromEntries(m.map(x => [x.id, x])); } catch (e) { console.error(e); toast("读取数据失败：" + (e.message || e.code)); }
  render();
})();
</script>
